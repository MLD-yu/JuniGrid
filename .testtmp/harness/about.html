<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
<meta charset="utf-8" />
<title>about sponsor harness</title>
<link rel="stylesheet" href="../../JuniGrid/wwwroot/css/base.css" />
<link rel="stylesheet" href="../../JuniGrid/wwwroot/css/shell.css" />
<link rel="stylesheet" href="../../JuniGrid/wwwroot/css/misc.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--jg-bg, #f4f5f7); font-family: "Microsoft YaHei", sans-serif; }
  .wrap { width: 760px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="jg-card jg-cursor-grid">
    <div style="font-weight:600">关于</div>
    <div class="jg-about">
      <div class="jg-about-main">
        <div class="jg-about-leftcol">
          <div class="jg-about-title-row">
            <span class="jg-pixel-title">JuniGrid</span>
            <span class="jg-about-title-side">
              <span class="jg-shiny">· v1.2.13</span>
              <span class="jg-about-desc">Your helper for Stardew Valley.</span>
            </span>
          </div>
          <div class="jg-author-row">
            <span>作者：</span>
            <span class="jg-pixel-name">MLD</span>
          </div>
        </div>
        <div class="jg-sponsor">
          <div class="jg-sponsor-title">赞助支持：</div>
          <div class="jg-sponsor-sub">如果你喜欢 JuniGrid，可以请作者喝杯咖啡吗</div>
          <div class="jg-sponsor-tabs">
            <button type="button" class="jg-sponsor-tab active">微信</button>
            <button type="button" class="jg-sponsor-tab">支付宝</button>
          </div>
          <img class="jg-sponsor-qr" src="../../JuniGrid/wwwroot/assets/sponsor-wechat.jpg" alt="微信赞赏码" />
          <p class="jg-sponsor-note">
            请备注 QQ 或者微信号
            <span class="jg-help-tip jg-help-tip--right">
              <span class="jg-help-tip-btn">?</span>
              <span class="jg-help-tip-bubble">10元以上可以添加作者微信/QQ 并添加JuniGrid交流群 可抢先体验最新版JuniGrid或者新Mod</span>
            </span>
          </p>
          <button type="button" class="jg-sponsor-forgot">忘记备注</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="jg-dlg-overlay" id="dlg" style="display:none">
  <div class="jg-sponsor-panel" role="dialog" aria-modal="true">
    <h3 class="jg-sponsor-heading jg-sponsor-heading--center">请用微信扫码</h3>
    <div class="jg-sponsor-qr-shell">
      <img class="jg-sponsor-qr-img" src="../../JuniGrid/wwwroot/assets/sponsor-wechat-friend.jpg" alt="微信二维码" />
    </div>
    <div class="jg-sponsor-actions jg-sponsor-actions--center">
      <button type="button" class="jg-sponsor-btn solid">关闭</button>
    </div>
  </div>
</div>
</body>
</html>
