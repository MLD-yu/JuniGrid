<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>sponsor morph harness</title>
<link rel="stylesheet" href="../../JuniGrid/wwwroot/css/base.css" />
<link rel="stylesheet" href="../../JuniGrid/wwwroot/css/shell.css" />
<link rel="stylesheet" href="../../JuniGrid/wwwroot/css/theme.css" />
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #cfc9dd; font-family: "Microsoft YaHei", sans-serif; }
</style>
</head>
<body>
  <div class="jg-sponsor-panel" role="dialog" aria-modal="true">
    <div class="jg-sponsor-viewport" id="vp"></div>
  </div>

<script src="../../JuniGrid/wwwroot/js/junigrid.ui.js"></script>
<script>
const step0 = `<div class="jg-sponsor-stage">
  <div class="jg-sponsor-kicker">第 753 次启动 · 共 677.1 小时</div>
  <h3 class="jg-sponsor-heading">喜欢 JuniGrid 吗？</h3>
  <p class="jg-sponsor-copy">它已经为你启动了 753 次游戏。如果还算好用，能不能请作者喝杯咖啡？</p>
  <div class="jg-sponsor-actions">
    <button type="button" class="jg-sponsor-btn ghost">这次算了吧</button>
    <button type="button" class="jg-sponsor-btn solid">支持作者</button>
  </div>
</div>`;

const step1 = `<div class="jg-sponsor-stage">
  <div class="jg-sponsor-tabs">
    <button type="button" class="jg-sponsor-tab-btn active">微信</button>
    <button type="button" class="jg-sponsor-tab-btn">支付宝</button>
  </div>
  <div class="jg-sponsor-qr-shell"><img class="jg-sponsor-qr-img" src="../../JuniGrid/wwwroot/assets/sponsor-wechat.jpg" /></div>
  <p class="jg-sponsor-tip">请备注 QQ 或者微信号</p>
  <div class="jg-sponsor-divider"></div>
  <div class="jg-sponsor-or-row"><span>or</span><button type="button" class="jg-sponsor-afdian">去爱发电</button></div>
  <div class="jg-sponsor-actions">
    <button type="button" class="jg-sponsor-btn ghost">关闭</button>
    <button type="button" class="jg-sponsor-btn ghost">忘记备注</button>
    <button type="button" class="jg-sponsor-btn solid">已支持</button>
  </div>
</div>`;

const step2 = `<div class="jg-sponsor-stage">
  <h3 class="jg-sponsor-heading jg-sponsor-heading--center">请用微信扫码</h3>
  <div class="jg-sponsor-qr-shell"><img class="jg-sponsor-qr-img" src="../../JuniGrid/wwwroot/assets/sponsor-wechat-friend.jpg" /></div>
  <div class="jg-sponsor-actions jg-sponsor-actions--center">
    <button type="button" class="jg-sponsor-btn ghost">返回</button>
    <button type="button" class="jg-sponsor-btn solid">关闭</button>
  </div>
</div>`;

const STEPS = [step0, step1, step2];
const vp = document.getElementById('vp');
let cur = -1, leaveTimer = null;

// 模拟 Blazor 渲染：换屏时新一屏带 --waiting（隐身），离场屏绝对定位垫在下面
function render(step, leaving) {
  const parts = [];
  if (leaving !== null && leaving !== undefined) {
    parts.push('<div class="jg-sponsor-pane jg-sponsor-pane--leaving" aria-hidden="true">' + STEPS[leaving] + '</div>');
  }
  parts.push('<div id="pane" class="jg-sponsor-pane' + (leaving !== null ? ' jg-sponsor-pane--waiting' : '') + '">' + STEPS[step] + '</div>');
  vp.innerHTML = parts.join('');
  cur = step;
}

// go() = 点按钮 → 量高 → 换屏；morph 由 OnAfterRender 在渲染后调用
window.__go = function (next) {
  junigridJs.sponsorMeasure();
  const leaving = cur;
  render(next, leaving);
  if (leaveTimer) clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => {                 // 对应 ClearLeavingStepAsync(700ms)
    const l = vp.querySelector('.jg-sponsor-pane--leaving');
    if (l) l.remove();
  }, 700);
  requestAnimationFrame(() => junigridJs.sponsorMorph());
};

window.__firstOpen = function (step) { render(step, null); };

// 逐帧采样：新一屏可见（opacity>0.05）时，它的底部内容有没有超出视口（=被裁）
window.__probe = async function () {
  const samples = [];
  const t0 = performance.now();
  return await new Promise(resolve => {
    function tick() {
      const pane = vp.querySelector('.jg-sponsor-pane:not(.jg-sponsor-pane--leaving)');
      const acts = pane.querySelector('.jg-sponsor-actions');
      const pOp = parseFloat(getComputedStyle(pane).opacity);
      const vpR = vp.getBoundingClientRect();
      const cut = +(acts.getBoundingClientRect().bottom - vpR.bottom).toFixed(1);
      samples.push({ t: Math.round(performance.now() - t0), op: +pOp.toFixed(2),
                     cut, vp: Math.round(vpR.height) });
      if (performance.now() - t0 < 620) requestAnimationFrame(tick);
      else resolve(samples);
    }
    tick();
  });
};
</script>
</body>
</html>
